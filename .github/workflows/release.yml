  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/jaytik1/openapi_to_django/releases \
          -d "{\"tag_name\":\"$GITHUB_REF\", \"target_commitish\":\"main\", \"name\":\"$GITHUB_REF\", \"body\":\"Release version $GITHUB_REF\", \"draft\":true, \"generate_release_notes\":false}"
