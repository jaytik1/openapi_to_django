name: Create a draft GitHub Release

on:
 push:
  tags:
    - v*.*.*

jobs:
  build-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build packages
        run: |
          pip install poetry
          poetry install
          poetry build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  create-release:
    runs-on: ubuntu-latest
    needs:
      - build-packages
    permissions:
      contents: write

    steps:
      - name: Get version from tag
        id: get_version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo $(ls)
          echo "version=$(echo $TAG | sed "s/v//g")" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          version: ${{ steps.get_version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog_reader.outputs.changes }}
        run: |
          curl -L --fail-with-body \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/jaytik1/openapi_to_django/releases \
          -d "{\"tag_name\":\"$TAG\", \"target_commitish\":\"main\", \"name\":\"$TAG\", \"body\":\"$BODY\", \"draft\":true, \"generate_release_notes\":false}" \
          -o response.json

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Upload packages as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_upload_url=$(cat response.json | jq -r .upload_url | sed -e "s/{.*}//g")

          for package in $(ls dist/); do
            curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            "$base_upload_url?name=$package" \
            --data-binary "@dist/$package";
          done
