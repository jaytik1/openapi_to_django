name: Python workflow

on: ["push"] # TODO remove this line, used for testing
#  push:
#    branches: ["main"]
#  pull_request:
#    branches: ["main"]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Check type hints with mypy
      run: mypy --junit-xml reports/mypy-junit.xml
    - name: Upload mypy JUnit report
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        path: reports/mypy-junit.xml
    - name: Test error
      run: echo "::error file={src/loadopenapi.py},line={160},endLine={160},title={mypy test}::{Incompatible type 'list[PathData]'}"
